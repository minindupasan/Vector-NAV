# VECTOR NAV — Hardware control parameters (Raspberry Pi)

motor_driver:
  ros__parameters:
    # Diff-drive geometry (must match URDF / diff_drive_controller.yaml)
    wheel_separation: 0.178
    wheel_radius: 0.034

    # Encoder: 11 PPM × ~20.5:1 gearbox = 225 ticks/output rev
    ticks_per_rev: 225

    # Control loop rate (Hz)
    control_rate: 50.0

    # Stop motors if no cmd_vel received for this long (seconds)
    cmd_vel_timeout: 0.5

    # Maximum wheel linear speed (m/s)
    # 280 RPM × 2π × 0.034m radius / 60 ≈ 1.0 m/s no-load
    max_motor_speed: 1.0

    # Motor Model (for feed-forward)
    motor_km: 1.0
    motor_tau: 0.15

    # PID Gains (tuned via dashboard)
    # LF
    pid_kp_lf: 0.37633
    pid_ki_lf: 6.25631
    pid_kd_lf: 0.0
    # LR
    pid_kp_lr: 0.42333
    pid_ki_lr: 10.55251
    pid_kd_lr: 0.0
    # RF
    pid_kp_rf: 0.39689
    pid_ki_rf: 6.59491
    pid_kd_rf: 0.0
    # RR
    pid_kp_rr: 0.65185
    pid_ki_rr: 8.12396
    pid_kd_rr: 0.0

    # Minimum speeds to prevent stalling (identified via teleop)
    min_linear_speed: 0.07
    min_angular_speed: 1.0

    # Minimum PWM to overcome static friction
    min_pwm: 0.18

    # Encoder direction flips (1 or -1)
    # Use if a wheel reports negative velocity when moving forward
    encoder_flip_lf: 1
    encoder_flip_lr: 1
    encoder_flip_rf: 1
    encoder_flip_rr: 1

    # Frame IDs
    odom_frame: odom
    base_frame: base_link

    # Let EKF handle odom→base_link TF
    publish_tf: false

imu_publisher:
  ros__parameters:
    i2c_bus: 1
    publish_rate: 100.0

    # MPU6500 ranges
    accel_range: 2      # 2, 4, 8, or 16 g
    gyro_range: 250     # 250, 500, 1000, or 2000 deg/s

    # Madgwick filter gain (higher = faster convergence, more noise)
    madgwick_beta: 0.1

    # Gyro calibration samples at startup (keep robot still!)
    calibrate_samples: 200

    # Use HMC5883L magnetometer for 9-DOF (set false for 6-DOF only)
    use_magnetometer: true

    # Must match URDF imu_link
    frame_id: imu_link
