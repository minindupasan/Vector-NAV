# ============================================================================
# VECTOR NAV — vector-camera service
# Managed by vector-camera.service (systemd)
# ============================================================================

services:
  vector-camera:
    image: vector-camera:latest
    build:
      context: .
      dockerfile: Dockerfile.camera
    container_name: vector-camera

    # Host network so DDS topics are shared with vector-control
    network_mode: host

    # Full hardware access (camera CSI, video devices)
    privileged: true

    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

    volumes:
      # ── /dev: video device nodes ──
      - /dev:/dev

      # ── Camera (libcamera runtime socket + udev for device discovery) ──
      - /run/libcamera:/run/libcamera
      - /run/udev:/run/udev:ro

      # ── Firmware / device-tree ──
      - /lib/firmware:/lib/firmware:ro
      - /proc/device-tree:/proc/device-tree:ro

      # ── Live source mount for development ──
      - ./vector_camera:/ros2_ws/src/vector_camera:ro

    restart: unless-stopped

    command: ["ros2", "launch", "vector_camera", "camera.launch.py"]
