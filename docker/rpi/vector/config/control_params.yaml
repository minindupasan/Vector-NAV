# VECTOR NAV — Hardware control parameters (Raspberry Pi)
# Minimal config: no PID, no ramping. Direct proportional PWM.

motor_driver:
  ros__parameters:
    # Diff-drive geometry (must match URDF)
    wheel_separation: 0.178
    wheel_radius: 0.0325

    # Encoder: 11 PPM × ~20.5:1 gearbox = 225 ticks/output rev
    ticks_per_rev: 225

    # Control loop rate (Hz)
    control_rate: 50.0

    # Stop motors if no cmd_vel received for this long (seconds)
    cmd_vel_timeout: 0.5

    # Maximum wheel linear speed (m/s)
    max_motor_speed: 0.5

    # Frame IDs
    odom_frame: odom
    base_frame: base_link

    # Let EKF handle odom→base_link TF
    publish_tf: false

imu_publisher:
  ros__parameters:
    i2c_bus: 1
    publish_rate: 100.0

    # MPU6500 ranges
    accel_range: 2      # 2, 4, 8, or 16 g
    gyro_range: 250     # 250, 500, 1000, or 2000 deg/s

    # Madgwick filter gain (higher = faster convergence, more noise)
    madgwick_beta: 0.1

    # Gyro calibration samples at startup (keep robot still!)
    calibrate_samples: 200

    # Use HMC5883L magnetometer for 9-DOF (set false for 6-DOF only)
    use_magnetometer: true

    # Must match URDF imu_link
    frame_id: imu_link
