# ============================================================================
# VECTOR NAV — Raspberry Pi 5 Docker Compose
#
# Two containers sharing ROS2 topics via DDS over host network:
#   vector-control: motor control, IMU, encoders, EKF
#   vector-camera:  RPi Camera Module 3 stream as ROS2 topic
#
# Usage:
#   cd ~/vector_nav/docker/rpi
#   docker compose up --build
# ============================================================================

services:
  vector-control:
    image: vector-control:latest
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: vector-control

    # Host network so DDS multicast works between Pi and Jetson
    network_mode: host

    # Full hardware access (GPIO, I2C, SPI, serial)
    privileged: true

    # Join the host 'gpio' group (GID 986) so lgpio can open /dev/gpiochip0
    group_add:
      - '986'

    environment:
      # Must match the Jetson's ROS_DOMAIN_ID for DDS discovery
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=/config/cyclonedds.xml
      - GPIOZERO_PIN_FACTORY=lgpio

    volumes:
      # ── /dev: all device nodes (GPIO chips, I2C, SPI, serial) ──
      # /dev/lidar is a udev symlink → actual ttyUSB device (see 99-lidar.rules)
      - /dev:/dev

      # ── CycloneDDS config (pin DDS to eth0 for Jetson↔RPi link) ──
      - ./config:/config:ro

      # ── Live source mount for development ──
      - ./vector_control:/ros2_ws/src/vector_control:ro

      # ── Firmware / device-tree ──
      - /lib/firmware:/lib/firmware:ro
      - /proc/device-tree:/proc/device-tree:ro

    restart: unless-stopped

    command: ["ros2", "launch", "vector_control", "control.launch.py"]

