<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Nav — Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <div class="header">
        <div class="brand">
            <div class="logo-mark">
                <span></span><span></span><span></span><span></span>
            </div>
            <h1>VECTOR<span class="accent-text">NAV</span></h1>
        </div>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="spectrum-wrap">
        <canvas id="spectrum" class="spectrum"></canvas>
    </div>

    <div class="controls">
        <span class="state-label" id="stateLabel">Ready</span>
        <button class="mic-btn" id="micBtn" disabled aria-label="Hold to speak">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="12" rx="3"></rect>
                <path d="M5 10a7 7 0 0 0 14 0"></path>
                <line x1="12" y1="17" x2="12" y2="22"></line>
                <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
        </button>
        <span class="state-label" id="stateDetail"></span>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
