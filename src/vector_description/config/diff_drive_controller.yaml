controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    # 4-wheel diff drive: pair left and right wheels together
    left_wheel_names:  [wheel_fl_joint, wheel_rl_joint]
    right_wheel_names: [wheel_fr_joint, wheel_rr_joint]

    # Wheel geometry — adjust if odometry drifts
    # Track width: distance between left and right wheel centres ≈ 0.178 m
    # Wheel radius derived from inertia: ~0.038 m
    wheel_separation: 0.178
    wheel_radius: 0.038

    # Allow separate left/right radius calibration
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    # Velocity/acceleration limits
    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            1.0   # m/s
    linear.x.min_velocity:           -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        1.0
    linear.x.min_acceleration:       -1.0

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.0   # rad/s
    angular.z.min_velocity:           -2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        2.0
    angular.z.min_acceleration:       -2.0
